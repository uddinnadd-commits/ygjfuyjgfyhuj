name: Build mod jar

on:
  workflow_dispatch:
    inputs:
      forge_version:
        description: "Forge build for 1.21.1, e.g. 52.1.0 (blank = recommended)"
        required: false
        default: ""
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate the mod project
        run: |
          if [ -d src/main/java ]; then
            PROJECT="$PWD"
          else
            ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n1)
            [ -n "$ZIP" ] || { echo "::error::No src folder and no .zip in the repo"; exit 1; }
            mkdir -p "$RUNNER_TEMP/proj"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/proj"
            JAVA_DIR=$(find "$RUNNER_TEMP/proj" -type d -path '*/src/main/java' -not -path '*/__MACOSX/*' | head -n1)
            [ -n "$JAVA_DIR" ] || { echo "::error::No src/main/java inside $ZIP"; exit 1; }
            PROJECT=$(dirname "$(dirname "$(dirname "$JAVA_DIR")")")
          fi
          echo "Project: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Download the Forge 1.21.1 MDK
        env:
          WANTED: ${{ inputs.forge_version }}
        run: |
          VER="$WANTED"
          if [ -z "$VER" ]; then
            VER=$(curl -fsSL https://files.minecraftforge.net/maven/net/minecraftforge/forge/promotions_slim.json \
              | python3 -c "import json,sys; p=json.load(sys.stdin)['promos']; print(p.get('1.21.1-recommended') or p.get('1.21.1-latest') or '')" || true)
          fi
          VER="${VER:-52.1.0}"
          echo "Using Forge 1.21.1-$VER"
          curl -fsSL -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.1-$VER/forge-1.21.1-$VER-mdk.zip"
          mkdir mdk
          unzip -q mdk.zip -d mdk
          GRADLEW=$(find mdk -name gradlew | head -n1)
          [ -n "$GRADLEW" ] || { echo "::error::No gradlew inside the MDK"; exit 1; }
          echo "MDK=$(realpath "$(dirname "$GRADLEW")")" >> "$GITHUB_ENV"

      - name: Put the mod into the MDK
        run: |
          [ -f "$PROJECT/gradle.properties.example" ] || { echo "::error::gradle.properties.example is missing"; exit 1; }
          rm -rf "$MDK/src"
          cp -r "$PROJECT/src" "$MDK/src"
          python3 - "$MDK/gradle.properties" "$PROJECT/gradle.properties.example" <<'PY'
          import re, sys
          target, example = sys.argv[1], sys.argv[2]
          new = {}
          for line in open(example, encoding="utf-8"):
              line = line.strip()
              if line and not line.startswith("#") and "=" in line:
                  k, v = line.split("=", 1)
                  k = k.strip()
                  if not k.startswith(("minecraft_", "forge_", "mapping_")):
                      new[k] = v.strip()
          out, seen = [], set()
          for line in open(target, encoding="utf-8").read().splitlines():
              m = re.match(r"\s*([\w.]+)\s*=", line)
              if m and m.group(1) in new:
                  out.append(f"{m.group(1)}={new[m.group(1)]}")
                  seen.add(m.group(1))
              else:
                  out.append(line)
          out += [f"{k}={v}" for k, v in new.items() if k not in seen]
          open(target, "w", encoding="utf-8").write("\n".join(out) + "\n")
          PY
          grep -E '^(mod_|minecraft_version|forge_version)' "$MDK/gradle.properties"

      - name: Build
        run: |
          cd "$MDK"
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show the errors
        if: failure()
        run: |
          {
            echo "### Build failed. Copy the block below and send it to Claude."
            echo '~~~'
            if [ -f build.log ]; then
              grep -E -A4 'error:|What went wrong' build.log | head -n 120 || true
            else
              echo "Failed before the build started. Open the red step in the log above."
            fi
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: skyfall-jar
          path: ${{ env.MDK }}/build/libs/*.jar
          if-no-files-found: error

      - name: Publish the jar as a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          JAR=$(ls "$MDK"/build/libs/*.jar | grep -v -E -- '-(sources|javadoc)\.jar$' | head -n1)
          gh release create "build-${{ github.run_number }}" "$JAR" \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from commit ${{ github.sha }}"
